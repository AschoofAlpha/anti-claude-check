name: Feature request
description: Suggest a new audit check or workflow improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What pain point or gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should be added or changed?
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Alternatives
      description: What alternatives have you considered?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This stays within the project boundary (no fingerprint spoofing, no automation concealment, no ban guarantee)
          required: true
